version: "3.8"
services:
  app:
    image: ghcr.io/vovastelmashchuk/main-app:${GIT_COMMIT_HASH:-latest}
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - 7100:3000
    environment:
      - NUXT_PUBLIC_BASE_URL=https://nest2d.stelmashchuk.dev
      - NUXT_PUBLIC_GOOGLE_CLIENT_ID=476104126469-bv13u3dlpooq1j3jglcgj7sup6dt26nk.apps.googleusercontent.com
      - NUXT_DATABASE_URL=${DATABASE_URL}
      - NUXT_RESEND_TOKEN=${RESEND_TOKEN}
      - NUXT_API_TOKEN=${API_TOKEN}
      - NUXT_STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
    deploy:
      update_config:
        order: start-first
    networks:
      - infra_reverse-proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/service/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
  
  user-file-processing-worker-normal:
    image: ghcr.io/vovastelmashchuk/user-file-processing-worker:${GIT_COMMIT_HASH:-latest}
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - WORKER_TAG=normal
      - MAX_ENTITY_LIMIT=999
    deploy:
      replicas: ${WORKERS_REPLICAS}
      update_config:
        order: start-first

  user-file-processing-worker-1k-entity-count:
    image: ghcr.io/vovastelmashchuk/user-file-processing-worker:${GIT_COMMIT_HASH:-latest}
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - WORKER_TAG=1k_entity_count
      - MAX_ENTITY_LIMIT=999999
    deploy:
      replicas: ${WORKERS_REPLICAS}
      update_config:
        order: start-first

  nesting-worker:
    image: ghcr.io/vovastelmashchuk/nesting-worker:${GIT_COMMIT_HASH:-latest}
    environment:
      - DATABASE_URL=${DATABASE_URL}
    deploy:
      replicas: ${WORKERS_REPLICAS}
      update_config:
        order: start-first

  strip-file-processing-worker:
    image: ghcr.io/vovastelmashchuk/strip-file-processing-worker:${GIT_COMMIT_HASH:-latest}
    environment:
      - DATABASE_URL=${DATABASE_URL}
    deploy:
      replicas: ${WORKERS_REPLICAS}
      update_config:
        order: start-first

  strip-nesting-worker:
    image: ghcr.io/vovastelmashchuk/strip-nesting-worker:${GIT_COMMIT_HASH:-latest}
    environment:
      - DATABASE_URL=${DATABASE_URL}
    deploy:
      replicas: ${WORKERS_REPLICAS}
      update_config:
        order: start-first

networks:
  infra_reverse-proxy:
    external: true
