version: "3.8"
services:
  user-file-processing-worker-normal:
    image: ghcr.io/vovastelmashchuk/user-file-processing-worker:latest
    environment:
      - DATABASE_URL=postgres://nest2d:nest2d@postgres:5432/nest2d
      - WORKER_TAG=normal
      - MAX_ENTITY_LIMIT=999
    deploy:
      replicas: 1
      update_config:
        order: start-first

  nesting-worker:
    image: ghcr.io/vovastelmashchuk/nesting-worker:latest
    environment:
      - DATABASE_URL=postgres://nest2d:nest2d@postgres:5432/nest2d
    deploy:
      replicas: 1
      update_config:
        order: start-first

  strip-file-processing-worker:
    image: ghcr.io/vovastelmashchuk/strip-file-processing-worker:latest
    environment:
      - DATABASE_URL=postgres://nest2d:nest2d@postgres:5432/nest2d
    deploy:
      replicas: 1
      update_config:
        order: start-first

  strip-nesting-worker:
    image: ghcr.io/vovastelmashchuk/strip-nesting-worker:latest
    environment:
      - DATABASE_URL=postgres://nest2d:nest2d@postgres:5432/nest2d
    deploy:
      replicas: 1
      update_config:
        order: start-first

  postgres:
    image: postgres:17
    environment:
      - POSTGRES_USER=nest2d
      - POSTGRES_PASSWORD=nest2d
      - POSTGRES_DB=nest2d
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
